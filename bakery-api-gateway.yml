
springdoc:
  swagger-ui:
    urls:
      - name: Auth Service
        url: /docs/auth
      - name: Cart Service
        url: /docs/cart
      - name: Product Service
        url: /docs/product
      - name: Order Service
        url: /docs/order
      - name: Payment Service
        url: /docs/payment
      - name: Notification Service
        url: /docs/notification
      - name: Engagement Service
        url: /docs/engagement

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,refresh,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: always

spring:
  http:
    codecs:
      max-in-memory-size: 55MB
  data:
    redis:
      host: ${REDIS_HOST:redis-gateway}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RewritePath=(?<segment>.*[^/])/+$, $\{segment}
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: auth-service-openapi
              uri: lb://bakery-auth-service
              predicates:
                - Path=/docs/auth
              filters:
                - RewritePath=/docs/auth, /v3/api-docs
            - id: cart-service-openapi
              uri: lb://bakery-cart-service
              predicates:
                - Path=/docs/cart
              filters:
                - RewritePath=/docs/cart, /v3/api-docs
            - id: product-service-openapi
              uri: lb://bakery-product-service
              predicates:
                - Path=/docs/product
              filters:
                - RewritePath=/docs/product, /v3/api-docs
            - id: order-service-openapi
              uri: lb://bakery-order-service
              predicates:
                - Path=/docs/order
              filters:
                - RewritePath=/docs/order, /v3/api-docs
            - id: payment-service-openapi
              uri: lb://bakery-payment-service
              predicates:
                - Path=/docs/payment
              filters:
                - RewritePath=/docs/payment, /v3/api-docs
            - id: notification-service-openapi
              uri: lb://bakery-notification-service
              predicates:
                - Path=/docs/notification
              filters:
                - RewritePath=/docs/notification, /v3/api-docs
            - id: auth-service
              uri: lb://bakery-auth-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/store/**
              filters:
                - RewritePath=/api/v1/(?<remaining>.*), /api/$\{remaining}
                - AuthenticationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
            - id: product-service
              uri: lb://bakery-product-service
              predicates:
                - Path=/api/v1/categories/**,/api/v1/products/**,/api/v1/inventory/**,/api/v1/uploads/**,/api/v1/storefront/**,/api/v1/taxes/**
              filters:
                - RewritePath=/api/v1/(?<remaining>.*), /api/$\{remaining}
                - AuthenticationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
            - id: order-service
              uri: lb://bakery-order-service
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - RewritePath=/api/v1/(?<remaining>.*), /api/$\{remaining}
                - AuthenticationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
            - id: payment-service
              uri: lb://bakery-payment-service
              predicates:
                - Path=/api/v1/payments/**,/api/v1/refunds/**,/api/v1/transactions/**,/api/v1/admin/payments/**
              filters:
                - RewritePath=/api/v1/(?<remaining>.*), /api/$\{remaining}
                - AuthenticationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
            - id: cart-service
              uri: lb://bakery-cart-service
              predicates:
                - Path=/api/v1/carts/**,/api/v1/cart-items/**
              filters:
                - RewritePath=/api/v1/(?<remaining>.*), /api/$\{remaining}
                - AuthenticationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
            - id: notification-service
              uri: lb://bakery-notification-service
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - RewritePath=/api/v1/(?<remaining>.*), /api/$\{remaining}
                - AuthenticationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
            - id: engagement-service-openapi
              uri: lb://bakery-engagement-service
              predicates:
                - Path=/docs/engagement
              filters:
                - RewritePath=/docs/engagement, /v3/api-docs
            - id: engagement-service
              uri: lb://bakery-engagement-service
              predicates:
                - Path=/api/v1/engagement/**
              filters:
                - RewritePath=/api/v1/(?<remaining>.*), /api/$\{remaining}
                - AuthenticationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20


logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.http.server.reactive: INFO
    org.springframework.web.reactive: INFO
    reactor.ipc.netty: INFO
    reactor.netty: INFO
    root: INFO

---
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG

